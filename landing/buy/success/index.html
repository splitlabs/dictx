<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictx Pro Activated</title>
    <meta
      name="description"
      content="Your Dictx Pro purchase is complete. Copy your license key and activate in the app."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- DataFast (cookieless build), served first-party via landing/vercel.json
         rewrites and injected after the load event. On this page it also
         attributes the purchase: the tag reads the checkout id from the URL
         and DataFast joins it to the payment via its provider connection. -->
    <script id="datafast-queue">
      window.datafast =
        window.datafast ||
        function () {
          (window.datafast.q = window.datafast.q || []).push(arguments);
        };
      addEventListener(
        "load",
        function () {
          var s = document.createElement("script");
          s.async = true;
          s.src = "/js/script.cookieless.js";
          s.dataset.websiteId = "dfid_kcdGTJEa3xayul7fOPaip";
          s.dataset.domain = "dictx.splitlabs.io";
          document.head.appendChild(s);
        },
        { once: true },
      );
    </script>
  </head>
  <body>
    <div class="noise"></div>

    <header class="shell nav">
      <a class="brand" href="/">
        <img class="brand-icon" src="/logo.png" alt="Dictx logo" />
        <span class="wordmark">Dictx</span>
      </a>
      <div class="menu">
        <a href="/">Home</a>
      </div>
    </header>

    <main class="shell">
      <section class="panel hero">
        <p class="kicker">Purchase Complete</p>
        <h1>Activate Dictx Pro</h1>
        <p class="lede">
          Copy your license key and paste it in Dictx:
          <strong>Settings -> About -> Activate Dictx Pro</strong>.
        </p>

        <div class="card" style="margin-top: 16px">
          <h2 style="font-size: 18px">Your License Key</h2>
          <p
            id="license-key-value"
            style="word-break: break-all; font-family: monospace"
          >
            Your license key appears here after checkout. Opening this page
            again from the same link shows the same key.
          </p>
          <div class="actions" style="margin-top: 12px">
            <button
              id="copy-btn"
              class="btn primary"
              type="button"
              data-fast-goal="license_key_copied"
              disabled
            >
              Copy License Key
            </button>
            <a class="btn ghost" href="/">Back to Dictx</a>
          </div>
          <p id="copy-status" class="meta" style="margin-top: 8px"></p>
        </div>
      </section>
    </main>

    <script>
      const SUPPORT_EMAIL = "nyk@builderz.dev";
      const params = new URLSearchParams(window.location.search);
      const sessionId = (params.get("session_id") || "").trim();
      const valueEl = document.getElementById("license-key-value");
      const copyBtn = document.getElementById("copy-btn");
      const copyStatus = document.getElementById("copy-status");
      let key = "";

      const showKey = (value) => {
        key = value;
        valueEl.textContent = value;
        copyBtn.disabled = false;
      };

      const MESSAGES = {
        402: "Your payment is still being confirmed. Refresh this page in a minute.",
        409:
          "This checkout was not for Dictx Pro. Email " +
          SUPPORT_EMAIL +
          " with this page's address.",
        410: "This purchase was refunded, so no license key is issued.",
      };
      const FALLBACK_MESSAGE =
        "We could not load your license key. Refresh in a minute, or email " +
        SUPPORT_EMAIL +
        " with this page's address.";

      if (sessionId) {
        // Stripe checkout: the server verifies the purchase and issues the key.
        valueEl.textContent = "Fetching your license key...";
        fetch("/api/pro/license?session_id=" + encodeURIComponent(sessionId), {
          cache: "no-store",
        })
          .then((response) =>
            response
              .json()
              .catch(() => ({}))
              .then((body) => ({ response, body })),
          )
          .then(({ response, body }) => {
            if (response.ok && body.licenseKey) {
              showKey(body.licenseKey);
              return;
            }
            valueEl.textContent = MESSAGES[response.status] || FALLBACK_MESSAGE;
          })
          .catch(() => {
            valueEl.textContent = FALLBACK_MESSAGE;
          });
      } else {
        // Earlier Polar purchases: the key or checkout id arrives in the URL.
        const legacy = (
          params.get("license_key") ||
          params.get("licenseKey") ||
          params.get("checkout_id") ||
          ""
        ).trim();
        if (legacy) {
          showKey(legacy);
        } else {
          valueEl.textContent =
            "If no key is shown here, copy your key from the Polar customer portal or receipt email.";
        }
      }

      copyBtn.addEventListener("click", async () => {
        if (!key) return;
        try {
          await navigator.clipboard.writeText(key);
          copyStatus.textContent =
            "Copied. Paste it in Dictx Settings -> About.";
        } catch (_error) {
          copyStatus.textContent = "Copy failed. Select and copy manually.";
        }
      });
    </script>
  </body>
</html>
